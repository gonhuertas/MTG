<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Color Are You? — A Magic: The Gathering Quiz</title>
<style>
  :root {
    --w: #d4af37;   /* White  -> gold */
    --u: #3a7cc4;   /* Blue   */
    --b: #4b4554;   /* Black  -> slate-purple */
    --r: #cb4b3e;   /* Red    */
    --g: #3fa463;   /* Green  */
    --ink: #23252b;
    --muted: #6b7280;
    --line: #e7e8ec;
    --bg: #f6f7f9;
    --card: #ffffff;
    --radius: 16px;
    --shadow: 0 10px 40px rgba(20,23,33,0.08), 0 2px 8px rgba(20,23,33,0.04);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%;
    max-width: 660px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 44px 36px;
    overflow: hidden;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 10px;
  }

  h1 {
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }

  .lede {
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 28px;
  }

  .btn {
    display: inline-block;
    border: none;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    border-radius: 12px;
    transition: transform .12s ease, box-shadow .12s ease, background .15s ease, border-color .15s ease;
  }

  .btn-primary {
    background: var(--ink);
    color: #fff;
    padding: 14px 26px;
    font-size: 15px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(20,23,33,0.18); }

  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 12px 22px;
    font-size: 14px;
  }
  .btn-ghost:hover { border-color: var(--ink); }

  /* progress */
  .progress-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .progress-head .count { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .progress-track {
    height: 6px;
    background: var(--line);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 30px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--u), var(--g));
    border-radius: 99px;
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }

  .question {
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 22px;
    letter-spacing: -0.01em;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    text-align: left;
    background: #fbfbfc;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 15px 18px;
    font-size: 15.5px;
    line-height: 1.45;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .14s ease, background .14s ease, transform .08s ease;
  }
  .option:hover { border-color: var(--ink); background: #fff; }
  .option:active { transform: scale(.992); }

  .back-row { margin-top: 24px; }
  .back-link {
    background: none; border: none; cursor: pointer; font: inherit;
    color: var(--muted); font-size: 14px; padding: 4px 0;
  }
  .back-link:hover { color: var(--ink); }
  .back-link[disabled] { opacity: .35; cursor: default; }

  /* fade animation */
  .fade { animation: fade .32s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }

  /* results */
  .result-swatches { display: flex; gap: 12px; margin: 4px 0 22px; }
  .swatch {
    width: 56px; height: 56px; border-radius: 14px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 22px;
  }
  .swatch.w { color: #6b531a; }  /* gold needs dark glyph */

  .result-kicker { font-size: 13px; letter-spacing:.12em; text-transform: uppercase; color: var(--muted); font-weight:600; margin:0 0 8px;}
  .result-title { font-size: 28px; margin: 0 0 16px; line-height: 1.2; }
  .result-body { font-size: 16px; line-height: 1.65; color: #3a3d45; margin: 0 0 14px; }
  .result-body strong { color: var(--ink); }

  .bars { margin: 26px 0 30px; display: flex; flex-direction: column; gap: 12px; }
  .bar-row { display: grid; grid-template-columns: 64px 1fr 42px; align-items: center; gap: 12px; }
  .bar-label { font-size: 13px; font-weight: 600; color: var(--ink); }
  .bar-track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; border-radius: 99px; transition: width .7s cubic-bezier(.2,.7,.2,1); }
  .bar-pct { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

  .footnote { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 22px 0 0; }

  @media (max-width: 520px) {
    .card { padding: 30px 24px 28px; }
    h1 { font-size: 25px; }
    .question { font-size: 20px; }
    .bar-row { grid-template-columns: 54px 1fr 40px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <main class="card" id="card"></main>
</div>

<script>
/* ---------- Color metadata ---------- */
const COLORS = {
  W: { name: "White", varc: "--w", hex: "#d4af37", glyph: "☀",
       creed: "Peace and prosperity through order, morality, and the group.",
       blurb: "You believe the world can be better than it is, and that the way there is putting the needs of the group ahead of your own. You value morality, fairness, structure, and community — a society where no one is left to suffer." },
  U: { name: "Blue", varc: "--u", hex: "#3a7cc4", glyph: "✶",
       creed: "Perfection through knowledge and self-improvement.",
       blurb: "You believe people are what they choose to become, and that knowledge is the path there. You prize learning, careful thought, and doing things right over doing them fast. Give you enough information and time, and you can solve almost anything." },
  B: { name: "Black", varc: "--b", hex: "#4b4554", glyph: "✦",
       creed: "Power through ruthless self-interest — be your own champion.",
       blurb: "You see the world clearly and pragmatically: no one will look out for you like you will. You believe in merit, ambition, and seizing opportunity without fear. You're willing to do what others won't to get what you want." },
  R: { name: "Red", varc: "--r", hex: "#cb4b3e", glyph: "✷",
       creed: "Freedom and fulfillment through emotion, impulse, and action.",
       blurb: "You believe a life worth living is one lived fully — listen to what you feel and act on it. You value passion, freedom, spontaneity, and loyalty to the people you love. You'd rather have high highs and low lows than feel nothing at all." },
  G: { name: "Green", varc: "--g", hex: "#3fa463", glyph: "❧",
       creed: "Acceptance of nature as it is; find and fulfill your role.",
       blurb: "You believe the world is already whole, and wisdom is accepting it rather than fighting it. You trust instinct, tradition, and your place in something larger than yourself. You've found your answers — now you live them." }
};
const ORDER = ["W","U","B","R","G"];

/* ---------- Questions (each option scores exactly one color) ---------- */
const QUESTIONS = [
  { q: "What's the surest path to a good life?",
    a: [
      ["W","Build a fair society where everyone's needs are met."],
      ["U","Learn all you can and become the best version of yourself."],
      ["B","Gain the power to live entirely on your own terms."],
      ["R","Follow your passions and squeeze every drop out of each day."],
      ["G","Find your natural place in the world and fulfill it."]
    ]},
  { q: "Facing a big decision, you tend to...",
    a: [
      ["U","Research every option carefully before you commit."],
      ["R","Trust your gut and act now."],
      ["W","Weigh what's right and what the rules say."],
      ["G","Go with what feels natural and true to you."],
      ["B","Pick whatever moves you closest to what you want."]
    ]},
  { q: "What do you believe shapes who a person becomes?",
    a: [
      ["U","A blank slate — you become whoever you choose to be."],
      ["G","An inborn nature and a role you grow into."],
      ["B","Sheer will — you are whatever you fight to become."],
      ["W","Your choices, guided by right and wrong."],
      ["R","What you feel and do in the moment."]
    ]},
  { q: "Other people are best thought of as...",
    a: [
      ["W","A community we're all responsible for."],
      ["B","Looking out for themselves — as everyone should."],
      ["G","Threads in one interconnected web of life."],
      ["R","People to connect with and share experiences."],
      ["U","Minds full of knowledge and untapped potential."]
    ]},
  { q: "Your honest feeling about rules is...",
    a: [
      ["W","Necessary — they keep everyone safe and fair."],
      ["R","Mostly obstacles between you and a full life."],
      ["B","Useful when they serve me, ignorable when they don't."],
      ["U","Good, as long as they make the system work better."],
      ["G","I trust natural order over rules imposed by people."]
    ]},
  { q: "How do you feel about change?",
    a: [
      ["G","The world is fine as it is; change should be slow and natural."],
      ["U","Change is how we improve toward something better."],
      ["R","Bring it on — change keeps life exciting."],
      ["B","I'll change whatever gets me ahead."],
      ["W","Change carefully, to make life better for everyone."]
    ]},
  { q: "Your greatest strength is...",
    a: [
      ["U","Knowledge — I can out-think almost any problem."],
      ["R","Speed and the nerve to act."],
      ["W","Discipline and a steady moral compass."],
      ["B","Relentless focus on what I want."],
      ["G","Unshakable certainty about who I am."]
    ]},
  { q: "What worries you most in other people?",
    a: [
      ["W","Recklessness and selfishness."],
      ["U","Acting without thinking it through."],
      ["B","Weakness, and letting others control you."],
      ["G","Arrogance — thinking we can master nature."],
      ["R","Being too afraid to ever truly live."]
    ]},
  { q: "When conflict comes, you...",
    a: [
      ["R","Meet it head-on, right now."],
      ["U","Stay patient — plan and wait for the right moment."],
      ["B","Do whatever it takes to come out ahead."],
      ["W","Resolve it through fair rules and justice."],
      ["G","Rely on strength and what comes naturally."]
    ]},
  { q: "At the very end, what would make a life well-lived?",
    a: [
      ["R","That you lived fully and have great stories to tell."],
      ["W","That you did right by others."],
      ["B","That you achieved exactly what you set out to."],
      ["U","That you reached your full potential."],
      ["G","That you played your part in something larger."]
    ]},
  { q: "Emotions are...",
    a: [
      ["R","The truest guide to what you actually need."],
      ["U","Best kept in check by reason."],
      ["W","Important — but the group comes first."],
      ["B","A tool: useful, but never in charge."],
      ["G","Part of your nature, to be accepted."]
    ]},
  { q: "Your ideal world looks like...",
    a: [
      ["W","A peaceful society free of suffering."],
      ["U","A place where everyone can reach their potential."],
      ["B","One where you're free to become anything."],
      ["R","Full of passion, freedom, and experience."],
      ["G","In harmony — everything in its natural place."]
    ]}
];

/* ---------- State ---------- */
let current = 0;
const answers = new Array(QUESTIONS.length).fill(null);
const card = document.getElementById("card");

/* ---------- Helpers ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ---------- Screens ---------- */
function renderIntro(){
  card.className = "card fade";
  card.innerHTML = `
    <p class="eyebrow">Magic: The Gathering</p>
    <h1>What color are you?</h1>
    <p class="lede">The five colors of <em>Magic</em> each stand for a way of seeing the world — order, knowledge, ambition, freedom, and nature. Answer 12 quick questions and find out which philosophy is yours. There are no wrong answers; just pick what rings true.</p>
    <button class="btn btn-primary" id="start">Start the quiz</button>
  `;
  document.getElementById("start").onclick = () => { current = 0; renderQuestion(); };
}

function renderQuestion(){
  const Q = QUESTIONS[current];
  const opts = shuffle(Q.a);
  const pct = Math.round((current/QUESTIONS.length)*100);
  card.className = "card fade";
  card.innerHTML = `
    <div class="progress-head">
      <span class="count">Question ${current+1} of ${QUESTIONS.length}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <h2 class="question">${Q.q}</h2>
    <div class="options" id="opts"></div>
    <div class="back-row">
      <button class="back-link" id="back" ${current===0?'disabled':''}>&larr; Back</button>
    </div>
  `;
  const box = document.getElementById("opts");
  opts.forEach(([color,text]) => {
    const b = document.createElement("button");
    b.className = "option";
    b.textContent = text;
    if (answers[current] === color) b.style.borderColor = "var(--ink)";
    b.onclick = () => {
      answers[current] = color;
      if (current < QUESTIONS.length - 1){ current++; renderQuestion(); }
      else { renderResult(); }
    };
    box.appendChild(b);
  });
  document.getElementById("back").onclick = () => {
    if (current > 0){ current--; renderQuestion(); }
  };
}

/* ---------- Scoring & result logic ---------- */
function tally(){
  const scores = { W:0,U:0,B:0,R:0,G:0 };
  answers.forEach(c => { if(c) scores[c]++; });
  return scores;
}

function classify(scores){
  // sorted descending, stable by ORDER for ties
  const ranked = ORDER.slice().sort((x,y) => scores[y]-scores[x]);
  const c1 = ranked[0], c2 = ranked[1];
  const s1 = scores[c1], s2 = scores[c2];
  const gap = s1 - s2;
  let mode;
  if (gap >= 4) mode = "single";
  else if (gap <= 1) mode = "dual";
  else mode = "primary";           // gap of 2 or 3
  return { ranked, c1, c2, s1, s2, gap, mode };
}

function renderResult(){
  const scores = tally();
  const total = QUESTIONS.length;
  const { ranked, c1, c2, mode } = classify(scores);
  const C1 = COLORS[c1], C2 = COLORS[c2];

  let kicker, title, body;
  if (mode === "single"){
    kicker = "Your color is";
    title = `${C1.name}`;
    body = `<p class="result-body">${C1.blurb}</p>
            <p class="result-body"><strong>${C1.name}'s creed:</strong> ${C1.creed}</p>`;
  } else if (mode === "primary"){
    kicker = "You are primarily";
    title = `${C1.name}, leaning ${C2.name}`;
    body = `<p class="result-body">${C1.blurb}</p>
            <p class="result-body">But you're not purely one color. There's a clear secondary streak of <strong>${C2.name}</strong> in you — ${C2.creed.charAt(0).toLowerCase()+C2.creed.slice(1)} That second voice shapes how your ${C1.name} side plays out.</p>`;
  } else { // dual
    kicker = "You are two colors";
    title = `${C1.name} & ${C2.name}`;
    body = `<p class="result-body">You don't fall cleanly into one philosophy — you genuinely live by two. You're as much <strong>${C1.name}</strong> as you are <strong>${C2.name}</strong>.</p>
            <p class="result-body"><strong>${C1.name}:</strong> ${C1.blurb}</p>
            <p class="result-body"><strong>${C2.name}:</strong> ${C2.blurb}</p>`;
  }

  // swatches for the colors being reported
  const reported = (mode === "single") ? [c1] : [c1, c2];
  const swatches = reported.map(c => {
    const cc = COLORS[c];
    const cls = (c === "W") ? "swatch w" : "swatch";
    return `<div class="${cls}" style="background:${cc.hex}" title="${cc.name}">${cc.glyph}</div>`;
  }).join("");

  // bars for every color
  const bars = ORDER.map(c => {
    const cc = COLORS[c];
    const pct = Math.round((scores[c]/total)*100);
    return `<div class="bar-row">
      <span class="bar-label">${cc.name}</span>
      <div class="bar-track"><div class="bar-fill" data-w="${pct}" style="background:${cc.hex}"></div></div>
      <span class="bar-pct">${pct}%</span>
    </div>`;
  }).join("");

  card.className = "card fade";
  card.innerHTML = `
    <p class="result-kicker">${kicker}</p>
    <h1 class="result-title">${title}</h1>
    <div class="result-swatches">${swatches}</div>
    ${body}
    <div class="bars">${bars}</div>
    <button class="btn btn-ghost" id="retake">Take the quiz again</button>
    <p class="footnote">Based on Mark Rosewater's "My Words" articles describing each color's philosophy. Your full profile is shown above — most people are a blend.</p>
  `;
  // animate bars
  requestAnimationFrame(() => {
    document.querySelectorAll(".bar-fill").forEach(el => {
      el.style.width = el.getAttribute("data-w") + "%";
    });
  });
  document.getElementById("retake").onclick = () => {
    answers.fill(null);
    current = 0;
    renderIntro();
  };
}

/* ---------- Boot ---------- */
renderIntro();
</script>
</body>
</html>
