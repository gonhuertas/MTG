<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Color Are You? — A Magic: The Gathering Quiz</title>
<style>
  :root {
    --w: #d4af37;   /* White  -> gold */
    --u: #3a7cc4;   /* Blue   */
    --b: #4b4554;   /* Black  -> slate-purple */
    --r: #cb4b3e;   /* Red    */
    --g: #3fa463;   /* Green  */
    --ink: #23252b;
    --muted: #6b7280;
    --line: #e7e8ec;
    --bg: #f6f7f9;
    --card: #ffffff;
    --radius: 16px;
    --shadow: 0 24px 60px rgba(0,0,0,0.45), 0 6px 18px rgba(0,0,0,0.30);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #14161f;
    background: radial-gradient(1100px 700px at 50% -10%, #2a2f47 0%, #181b27 45%, #0f1117 100%) fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%;
    max-width: 660px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 44px 36px;
    overflow: hidden;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 10px;
  }

  h1 {
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }

  .lede {
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 28px;
  }

  .btn {
    display: inline-block;
    border: none;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    border-radius: 12px;
    transition: transform .12s ease, box-shadow .12s ease, background .15s ease, border-color .15s ease;
  }

  .btn-primary {
    background: var(--ink);
    color: #fff;
    padding: 14px 26px;
    font-size: 15px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(20,23,33,0.18); }

  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 12px 22px;
    font-size: 14px;
  }
  .btn-ghost:hover { border-color: var(--ink); }

  /* progress */
  .progress-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .progress-head .count { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .progress-track {
    height: 6px;
    background: var(--line);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 30px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--u), var(--g));
    border-radius: 99px;
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }

  .question {
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 22px;
    letter-spacing: -0.01em;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex;
    align-items: center;
    text-align: left;
    background: #fbfbfc;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 15px 18px;
    font-size: 15.5px;
    line-height: 1.45;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .16s ease, background .16s ease, transform .08s ease, box-shadow .16s ease;
  }
  .option:hover { border-color: var(--ink); background: #fff; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(20,23,33,0.06); }
  .option:active { transform: scale(.992); }

  /* glyph slot — collapsed until the answer is chosen, then it expands in the answer's color */
  .opt-glyph {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: 0;
    margin-right: 0;
    overflow: hidden;
    opacity: 0;
    flex: 0 0 auto;
    font-size: 18px;
    line-height: 1;
    transition: width .26s cubic-bezier(.2,.7,.2,1), margin .26s cubic-bezier(.2,.7,.2,1), opacity .2s ease;
  }
  .opt-text { flex: 1 1 auto; }

  /* selected (post-pick) state: button adopts the answer's color */
  .option.selected {
    border-color: var(--opt-color);
    background: color-mix(in srgb, var(--opt-color) 30%, #fff);
    box-shadow: inset 0 0 0 1.5px var(--opt-color), 0 6px 20px color-mix(in srgb, var(--opt-color) 40%, transparent);
    transform: none;
  }
  .option.selected .opt-glyph { width: var(--glyph-w, 24px); margin-right: 11px; opacity: 1; }
  .option.locked { cursor: default; }
  .option.locked:not(.selected) { opacity: .5; }

  .back-row { margin-top: 24px; }
  .back-link {
    background: none; border: none; cursor: pointer; font: inherit;
    color: var(--muted); font-size: 14px; padding: 4px 0;
  }
  .back-link:hover { color: var(--ink); }
  .back-link[disabled] { opacity: .35; cursor: default; }

  /* fade animation */
  .fade { animation: fade .32s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }

  /* results */
  .result-swatches { display: flex; gap: 12px; margin: 4px 0 22px; }
  .swatch {
    width: 56px; height: 56px; border-radius: 14px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 22px;
  }
  .swatch.w { color: #6b531a; }  /* gold needs dark glyph */

  .result-kicker { font-size: 13px; letter-spacing:.12em; text-transform: uppercase; color: var(--muted); font-weight:600; margin:0 0 8px;}
  .result-title { font-size: 28px; margin: 0 0 16px; line-height: 1.2; }
  .result-body { font-size: 16px; line-height: 1.65; color: #3a3d45; margin: 0 0 14px; }
  .result-body strong { color: var(--ink); }
  .result-creed { font-size: 15px; font-style: italic; color: var(--muted); margin: -6px 0 16px; line-height: 1.5; }
  .result-subhead { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 28px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); }
  .result-subhead.with-swatch { display: flex; align-items: center; gap: 10px; }
  .swatch-sm { width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; line-height: 1; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.07); }
  .swatch-sm.w { color: #6b531a; }

  .radar-wrap { display: flex; justify-content: center; margin: 4px 0 28px; }
  .radar { width: 100%; max-width: 400px; height: auto; }
  .radar-data { animation: radarIn .6s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes radarIn { from { opacity: 0; } to { opacity: 1; } }

  .footnote { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 22px 0 0; }

  .result-learn { margin: 4px 0 24px; padding: 16px 18px; background: #fbfbfc; border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
  .result-learn .learn-label { font-size: 14px; color: var(--muted); }
  .result-learn .learn-link { font-size: 15px; font-weight: 600; color: var(--ink); text-decoration: none; width: fit-content; border-bottom: 1px solid var(--line); transition: border-color .14s ease; }
  .result-learn .learn-link:hover { border-color: var(--ink); }

  @media (max-width: 520px) {
    .card { padding: 30px 24px 28px; }
    h1 { font-size: 25px; }
    .question { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <main class="card" id="card"></main>
</div>

<script>
/* ---------- Color metadata ---------- */
const COLORS = {
  W: { name: "White", varc: "--w", hex: "#d4af37", glyph: "☀",
       url: "https://magic.wizards.com/en/news/making-magic/my-words-white",
       creed: "Peace and prosperity through order, morality, and the group.",
       paras: [
         "You believe the world doesn't have to be full of suffering — that peace and prosperity are genuinely within reach if people will put the needs of the group ahead of their own. Where others treat human selfishness as a fixed fact, you see a society that can be shaped toward fairness. Faced with almost any situation, your instinct is to ask not \"what do I want?\" but \"what does the group need?\"",
         "You trust structure to get there: clear rules, a shared sense of right and wrong, and institutions that reward doing good and discourage doing harm. You'd rather raise the floor for everyone than the ceiling for a lucky few, and a stranger you'll never meet still has a real claim on you. You hold yourself to standards even when they cost you something, because cutting a corner \"just this once\" is, to you, a step away from the world you're trying to build.",
         "Your great strength is conviction paired with preparation — give you time and you can build an answer to almost any problem, and you can lay your head down at night without regret. The flip side is rigidity: your answers are made in advance, so a threat you didn't see coming can catch you flat-footed, and your refusal to do the expedient-but-wrong thing sometimes lets problems you could have ended come back around. Others may read you as controlling or naive; you read it as the honest price of caring about everyone."
       ],
       sec: "There's a strong current of White in you as well — a pull toward fairness, structure, and looking after the people who can't look after themselves. It tempers your dominant color with a sense of responsibility to the group and a real discomfort with leaving anyone behind." },
  U: { name: "Blue", varc: "--u", hex: "#3a7cc4", glyph: "✶",
       url: "https://magic.wizards.com/en/news/making-magic/my-words-blue",
       creed: "Perfection through knowledge and self-improvement.",
       paras: [
         "You believe people aren't born finished. You become whoever you decide to make of yourself, and the way you get there is by learning. Knowledge is your lever on the world: faced with a choice, your instinct is to gather information, understand how the system actually works, and find the option that holds up best — rather than the one that simply feels right in the moment.",
         "You're willing to be slow if slow is what it takes to be correct. You'd rather take the extra time, think it all the way through, and account for what everyone else overlooked than move fast and clean up the mess later. You value the people and tools that extend what a mind can do — teachers, books, technology — and you tend to aim for the best version of a thing, not merely a version that works. Where others trust their gut, you trust the work.",
         "That is exactly your strength: given enough information and time, you can out-think almost any problem and see the structure other people miss. Your weakness is the mirror image — you need that time. Pushed to decide before you're ready, or dragged onto someone else's tempo, you can stall, over-analyze, or watch the window close while you're still weighing your options. Patience is your sharpest edge and, every so often, the trap you fall into."
       ],
       sec: "You also carry a clear streak of Blue — a need to understand before you act, and a respect for getting things right over getting them done fast. It makes your dominant color more deliberate, more curious, and a good deal harder to talk into anything you haven't thought through." },
  B: { name: "Black", varc: "--b", hex: "#4b4554", glyph: "✦",
       url: "https://magic.wizards.com/en/news/making-magic/my-words-black",
       creed: "Power through self-interest — be your own champion.",
       paras: [
         "You see the world without illusions: it's a hard place, no one is truly coming to save you, and the person best equipped to look after your interests is you. You don't find that bleak — you find it clarifying. Everyone deserves a champion, and you've decided to be your own. You believe people should be free to chase what they actually want, instead of shrinking themselves to fit what others expect of them.",
         "You think in concrete terms: what do I want, what stands in the way, and what do I have to work with — and then you act, without waiting for permission or apologizing for ambition. You'll do the things other people flinch from, spend what has to be spent, and take a calculated risk when the upside is real. You can be loyal, but you don't confuse loyalty with letting yourself be used. Self-reliance, for you, is a kind of integrity: be a burden to no one, and answer for what you do.",
         "Your strength is freedom from the limits that slow everyone else down — fewer taboos, less hesitation, and a clear eye for the opening others can't bring themselves to take. The danger is that same coin flipped over: the risks you're willing to run don't always pay off, and a refusal to depend on anyone can harden into coldness or tip into isolation. You'd rather own a hard outcome than be handed a safe one — but every now and then the bill for that comes due."
       ],
       sec: "There's a real vein of Black in you too — a pragmatic, self-reliant streak that won't wait around to be rescued and isn't ashamed of wanting things. It gives your dominant color teeth: a willingness to act in your own interest and to do what a situation actually demands." },
  R: { name: "Red", varc: "--r", hex: "#cb4b3e", glyph: "✷",
       url: "https://magic.wizards.com/en/news/making-magic/my-words-red",
       creed: "Freedom and fulfillment through emotion, impulse, and action.",
       paras: [
         "You believe a life is measured by whether it was actually lived. Your compass is what you feel — not as something to be suppressed, but as real information about what you need. When something matters to you, the honest response is to act on it, not to talk yourself out of it. You'd rather feel a thing all the way through than go numb to keep yourself safe.",
         "Freedom is close to sacred for you: freedom to chase what moves you, to change your mind, to live a life that's yours rather than one assembled to other people's specifications. And you're fiercely loyal to the handful of people who are truly yours — the ones who come before any abstract cause. You accept that living this way gets messy, that you'll collide with people and make mistakes, and you've made your peace with that, because the alternative is a lifetime of \"well, it could be worse.\"",
         "Your strength is momentum and honesty — you act while others are still deliberating, you say the true thing no one else in the room will, and you gather the experiences and connections a more cautious life never reaches. The cost is that you can be short-sighted, doing the thing today that becomes tomorrow's problem. People mistake your spontaneity for recklessness; from the inside it's just a refusal to let fear make your decisions for you. Sometimes that lands you in trouble — and you'd take the trade again."
       ],
       sec: "You've also got a strong Red current — a refusal to overthink your way out of living, and a trust in what you feel over what you're told you ought to want. It gives your dominant color heat: quicker to act, more honest about emotion, and more loyal to the people right in front of you." },
  G: { name: "Green", varc: "--g", hex: "#3fa463", glyph: "❧",
       url: "https://magic.wizards.com/en/news/making-magic/my-words-green",
       creed: "Acceptance of nature as it is; find and fulfill your role.",
       paras: [
         "You don't experience the world as something broken that needs fixing. It's already whole, and wisdom is learning to accept it rather than fight it. You trust what was there before all the arguing started — instinct, the things that have grown up over time, the customs that quietly work even when no one can quite explain why. Where others strain to become something new, you're at home being what you already are.",
         "You think in terms of belonging and role. You're part of something larger than yourself — a community, a lineage, a living whole that holds you up as you help hold it up. You'd rather work with what's actually in front of you than tear everything down chasing a fix that may cost more than the problem it solves. You can make peace with what won't move, including hard truths other people refuse to accept, and that steadiness becomes its own kind of strength when everyone around you is spinning.",
         "Your strength is certainty: while every other outlook is still searching, you've largely found your answers, and that gives you focus and calm. The weakness folded inside it is that same certainty pushed too far — you can lean so hard on what's familiar that you struggle when it's taken from you, and others may read your acceptance as having given up when you've actually just made peace. You know the difference, even when they don't."
       ],
       sec: "There's a grounded streak of Green in you too — a trust in instinct, in what has stood the test of time, and in your place within something bigger than yourself. It steadies your dominant color, trading a little restlessness for acceptance and a longer view." }
};
const ORDER = ["W","U","B","R","G"];

/* ---------- Questions ----------
   The questions live in an external file: questions.json
   They are loaded at startup by loadQuestions() at the bottom of this script.
   Each question is { "q": "...", "options": [ ... ] } where each option awards
   either one color { "color": "W", "text": "..." } or two at once (an allied-pair
   answer) { "colors": ["W","U"], "text": "..." }.
   Colors are W (White), U (Blue), B (Black), R (Red), G (Green). */
let QUESTIONS = [];

/* ---------- State ---------- */
let current = 0;
let answers = [];   // sized to the number of questions once they load
const card = document.getElementById("card");

/* ---------- Helpers ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ---------- Screens ---------- */
function renderIntro(){
  card.className = "card fade";
  card.innerHTML = `
    <p class="eyebrow">Magic: The Gathering</p>
    <h1>What color are you?</h1>
    <p class="lede">The five colors of <em>Magic</em> each stand for a way of seeing the world — order, knowledge, ambition, freedom, and nature. Answer 12 quick questions and find out which philosophy is yours. There are no wrong answers; just pick what rings true.</p>
    <button class="btn btn-primary" id="start">Start the quiz</button>
  `;
  document.getElementById("start").onclick = () => { current = 0; renderQuestion(); };
}

function renderQuestion(){
  const Q = QUESTIONS[current];
  const opts = shuffle(Q.options);
  const pct = Math.round((current/QUESTIONS.length)*100);
  card.className = "card fade";
  card.innerHTML = `
    <div class="progress-head">
      <span class="count">Question ${current+1} of ${QUESTIONS.length}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <h2 class="question">${Q.q}</h2>
    <div class="options" id="opts"></div>
    <div class="back-row">
      <button class="back-link" id="back" ${current===0?'disabled':''}>&larr; Back</button>
    </div>
  `;
  const box = document.getElementById("opts");
  let transitioning = false;   // block double-clicks during the reveal-then-advance pause

  opts.forEach(opt => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = `<span class="opt-glyph" aria-hidden="true"></span><span class="opt-text"></span>`;
    b.querySelector(".opt-text").textContent = opt.text;
    // if returning to an already-answered question, show its chosen color again
    if (answers[current] === opt) styleSelected(b, opt);
    b.onclick = () => {
      if (transitioning) return;
      answers[current] = opt;
      // lock the set, light up the chosen answer in its color, then move on
      box.querySelectorAll(".option").forEach(el => el.classList.add("locked"));
      styleSelected(b, opt);
      transitioning = true;
      setTimeout(() => {
        if (current < QUESTIONS.length - 1){ current++; renderQuestion(); }
        else { renderResult(); }
      }, 680);
    };
    box.appendChild(b);
  });
  document.getElementById("back").onclick = () => {
    if (current > 0){ current--; renderQuestion(); }
  };
}

// Which color(s) an option awards (single-color or an allied pair on Q1)
function optColors(opt){ return Array.isArray(opt.colors) ? opt.colors : [opt.color]; }

// Apply the chosen answer's color + glyph to its button
function styleSelected(button, opt){
  const cols = optColors(opt);
  button.classList.add("selected");
  button.style.setProperty("--opt-color", COLORS[cols[0]].hex);
  button.style.setProperty("--glyph-w", cols.length > 1 ? "46px" : "24px");
  if (cols.length > 1){
    const h1 = COLORS[cols[0]].hex, h2 = COLORS[cols[1]].hex;
    button.style.background = `linear-gradient(90deg, color-mix(in srgb, ${h1} 30%, #fff), color-mix(in srgb, ${h2} 30%, #fff))`;
    button.style.borderColor = h2;
  }
  const g = button.querySelector(".opt-glyph");
  g.innerHTML = cols.map(c => `<span style="color:${COLORS[c].hex}">${COLORS[c].glyph}</span>`).join("");
}

/* ---------- Scoring & result logic ---------- */
function tally(){
  const scores = { W:0,U:0,B:0,R:0,G:0 };
  // Each answer is the chosen option object. It either awards one color
  // ({color:"W"}) or two at once ({colors:["W","U"]} — an allied-pair answer).
  answers.forEach(opt => {
    if(!opt) return;
    if(Array.isArray(opt.colors)) opt.colors.forEach(c => { if(c in scores) scores[c]++; });
    else if(opt.color in scores) scores[opt.color]++;
  });
  return scores;
}

function classify(scores){
  // sorted descending; exact ties broken randomly (shuffle before the stable sort)
  const ranked = shuffle(ORDER).sort((x,y) => scores[y]-scores[x]);
  const c1 = ranked[0], c2 = ranked[1];
  const s1 = scores[c1], s2 = scores[c2];
  const total = ORDER.reduce((a,c) => a + scores[c], 0) || 1;
  let mode;
  if (s1 === s2)                 mode = "equal";    // genuine tie at the top → two co-equal colors
  else if (s2 / total < 0.18)    mode = "single";   // runner-up barely registers (<~18%) → one color
  else                           mode = "dominant"; // clear winner with a meaningful second → dominant + secondary
  return { ranked, c1, c2, s1, s2, total, mode };
}

// Build an SVG spider/radar chart of the full color profile.
// Radius is normalized so the leading color reaches the rim; labels show share of all answers.
function radarSVG(scores, topColor){
  const cx = 190, cy = 158, R = 88, labelR = R + 22;
  const max = Math.max(1, ...ORDER.map(c => scores[c]));
  const total = ORDER.reduce((a,c) => a + scores[c], 0) || 1;
  const ang = i => (-90 + i * 72) * Math.PI / 180;          // start at top, go clockwise
  const pt = (i, rad) => [cx + rad * Math.cos(ang(i)), cy + rad * Math.sin(ang(i))];
  const fmt = ([x,y]) => `${x.toFixed(1)},${y.toFixed(1)}`;

  let grid = "";
  [0.25, 0.5, 0.75, 1].forEach(level => {
    grid += `<polygon points="${ORDER.map((_,i)=>fmt(pt(i, R*level))).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  let spokes = "";
  ORDER.forEach((_,i) => {
    const [x,y] = pt(i, R);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  });
  const dataPts = ORDER.map((c,i) => fmt(pt(i, R * (scores[c] / max)))).join(" ");
  let dots = "", labels = "";
  ORDER.forEach((c,i) => {
    const cc = COLORS[c];
    const [dx,dy] = pt(i, R * (scores[c] / max));
    dots += `<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="4.5" fill="${cc.hex}" stroke="#fff" stroke-width="1.5"/>`;
    const [lx,ly] = pt(i, labelR);
    const anchor = Math.abs(lx - cx) < 6 ? "middle" : (lx > cx ? "start" : "end");
    const pct = Math.round(scores[c] / total * 100);
    labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="12.5" font-weight="600" fill="var(--ink)">${cc.name} <tspan fill="var(--muted)" font-weight="500">${pct}%</tspan></text>`;
  });
  const fill = COLORS[topColor].hex;
  return `<svg viewBox="0 0 380 312" class="radar" role="img" aria-label="Your color profile across White, Blue, Black, Red, and Green">
    ${grid}
    ${spokes}
    <polygon class="radar-data" points="${dataPts}" fill="${fill}" fill-opacity="0.18" stroke="${fill}" stroke-opacity="0.75" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    ${labels}
  </svg>`;
}

function renderResult(){
  const scores = tally();
  // Denominator is the actual total points awarded, not the question count —
  // allied-pair answers award 2 points, so scores no longer sum to QUESTIONS.length.
  const total = ORDER.reduce((s,c) => s + scores[c], 0) || 1;
  const { ranked, c1, c2, mode } = classify(scores);
  const C1 = COLORS[c1], C2 = COLORS[c2];

  // render an array of paragraph strings as <p class="result-body"> blocks
  const paras = arr => arr.map(p => `<p class="result-body">${p}</p>`).join("");
  // small inline color swatch (used beside section subheadings)
  const swatchSm = c => `<span class="swatch-sm${c === "W" ? " w" : ""}" style="background:${COLORS[c].hex}" aria-hidden="true">${COLORS[c].glyph}</span>`;

  let kicker, title, body;
  if (mode === "single"){
    kicker = "Your color is";
    title = C1.name;
    body = `<p class="result-creed">${C1.creed}</p>
            ${paras(C1.paras)}`;
  } else if (mode === "dominant"){
    kicker = "Your dominant color is";
    title = C1.name;
    body = `<p class="result-creed">${C1.creed}</p>
            ${paras(C1.paras)}
            <p class="result-subhead with-swatch">${swatchSm(c2)}Your secondary color — ${C2.name}</p>
            ${paras([C2.sec])}`;
  } else { // equal
    kicker = "You are two colors, in equal measure";
    title = `${C1.name} & ${C2.name}`;
    body = `<p class="result-body">Your top two colors came out tied — you don't fall cleanly into one philosophy, but genuinely live by two. Here's each of them in full.</p>
            <p class="result-subhead with-swatch">${swatchSm(c1)}${C1.name}</p>
            <p class="result-creed">${C1.creed}</p>
            ${paras(C1.paras)}
            <p class="result-subhead with-swatch">${swatchSm(c2)}${C2.name}</p>
            <p class="result-creed">${C2.creed}</p>
            ${paras(C2.paras)}`;
  }

  // colors that get a "learn more" link: dominant + secondary (or just the one)
  const reported = (mode === "single") ? [c1] : [c1, c2];
  // big swatch(es) in the header: only the dominant color, except in a true tie (show both)
  const headerColors = (mode === "equal") ? [c1, c2] : [c1];
  const swatches = headerColors.map(c => {
    const cc = COLORS[c];
    const cls = (c === "W") ? "swatch w" : "swatch";
    return `<div class="${cls}" style="background:${cc.hex}" title="${cc.name}">${cc.glyph}</div>`;
  }).join("");

  // spider/radar chart of the full color profile
  const radar = radarSVG(scores, c1);

  // "learn more" links to Mark Rosewater's full article for each reported color
  const learnLinks = reported.map(c =>
    `<a class="learn-link" href="${COLORS[c].url}" target="_blank" rel="noopener">${COLORS[c].name}'s philosophy →</a>`
  ).join("");
  const learnMore = `<div class="result-learn">
      <span class="learn-label">If you'd like to learn more about ${reported.length > 1 ? "your colors" : "your color"}:</span>
      ${learnLinks}
    </div>`;

  card.className = "card fade";
  card.innerHTML = `
    <p class="result-kicker">${kicker}</p>
    <h1 class="result-title">${title}</h1>
    <div class="result-swatches">${swatches}</div>
    ${body}
    <p class="result-subhead">Your full profile</p>
    <div class="radar-wrap">${radar}</div>
    ${learnMore}
    <button class="btn btn-ghost" id="retake">Take the quiz again</button>
    <p class="footnote">Based on Mark Rosewater's "My Words" articles describing each color's philosophy. The chart shows your share of answers across all five colors — most people are a blend.</p>
  `;
  document.getElementById("retake").onclick = () => {
    answers.fill(null);
    current = 0;
    renderIntro();
  };
}

/* ---------- Boot ---------- */
function renderLoadError(){
  card.className = "card fade";
  card.innerHTML = `
    <p class="eyebrow">Magic: The Gathering</p>
    <h1>Couldn't load the questions</h1>
    <p class="lede">The quiz reads its questions from <strong>questions.json</strong>, and the browser blocked that file from loading. This happens when you open <code>index.html</code> directly from your hard drive (a <code>file://</code> address) — browsers don't allow local pages to fetch other local files for security reasons.</p>
    <p class="lede">To run it, serve the folder over a tiny local web server. From this folder, run:<br>
    <code>python -m http.server</code><br>
    then open <code>http://localhost:8000</code> in your browser. (Published to GitHub Pages or any web host, it just works.)</p>
  `;
}

async function loadQuestions(){
  try {
    const res = await fetch("questions.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    QUESTIONS = data.questions;
    answers = new Array(QUESTIONS.length).fill(null);
    renderIntro();
  } catch (err) {
    console.error("Failed to load questions.json:", err);
    renderLoadError();
  }
}

loadQuestions();
</script>
</body>
</html>
